<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examination Results — Victory Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">VA</div>
        <span>VICTORY <span class="gold-gradient-text">ACADEMY</span></span>
      </a>
      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle-btn">🌓</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 3rem; padding-bottom: 5rem; max-width: 800px;">
    <div class="card" style="text-align: center; padding: 2.5rem; margin-bottom: 2.5rem;">
      <span class="card-badge" id="performance-badge">Performance Summary</span>
      <h1 style="font-size: 2.5rem; font-weight: 800; margin: 0.5rem 0;" class="gold-gradient-text" id="score-percentage">0%</h1>
      <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1.5rem;">
        Final Score: <strong id="score-number" style="color: var(--text-main);">0 / 0</strong>
      </p>

      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <button id="retake-btn" class="btn btn-gold btn-sm">Retake Examination</button>
        <button id="dashboard-btn" class="btn btn-outline btn-sm">Return to Dashboard</button>
      </div>
    </div>

    <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem;">Detailed Answer Review & Rationale</h2>
    <div id="review-stack"></div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/results.js"></script>
  <script src="js/telegram.js"></script>
</body>
</html>
