<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Catalog — Victory Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">VA</div>
        <span>VICTORY <span class="gold-gradient-text">ACADEMY</span></span>
      </a>
      <nav>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="courses.html" class="nav-link active">Courses</a></li>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          
        </ul>
      </nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle-btn">🌓</button>
        <button id="mobile-menu-btn" class="mobile-menu-toggle">☰</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
    <div class="section-header">
      <span class="section-pill">Faculty Courses</span>
      <h1 class="section-title">Explore Your Academic Subjects</h1>
      <p class="section-subtitle">Choose your course to begin chapter-by-chapter drills or timed examinations.</p>
    </div>

    <!-- Filters -->
    <div style="display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
      <input type="text" id="course-search" placeholder="Search by title or code..." style="flex: 1; min-width: 240px; padding: 0.8rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main);">
      <select id="program-filter" style="padding: 0.8rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main);">
        <option value="all">All Programs</option>
        <option value="pre-engineering">Pre-Engineering</option>
        <option value="natural-science">Natural Science</option>
        <option value="social-sciences">Social Sciences</option>
      </select>
    </div>

    <div class="cards-grid" id="courses-catalog-grid"></div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/json-loader.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/telegram.js"></script>
</body>
</html>
